                    if (this.selectedTank === key) {
                        ctx.strokeStyle = '#66bb6a';
                        ctx.lineWidth = 2;
                        roundRect(ctx, canvas.width / 2 - 290, y - 26, 530, 52, 12);
                        ctx.stroke();
                    }
                    ctx.fillStyle = this.selectedTank === key ? '#66bb6a' : '#fff';
                    ctx.font = 'bold 18px Arial';
                    ctx.textAlign = 'left';
                    ctx.fillText((i + 1) + '. ' + type.name, canvas.width / 2 - 260, y - 3);
                    ctx.fillStyle = '#bbb';
                    ctx.font = '12px Arial';
                    ctx.fillText(type.desc + ' | HP:' + type.hp + ' 速度:' + type.speed.toFixed(1) + ' 技能:' + type
                        .skill, canvas.width / 2 - 260, y + 15);
                    const dummy = new Tank(0, 0, type, false);
                    dummy.drawTankShape(ctx, canvas.width / 2 + 165, y, 32, 32, type.color, type.darkColor || '#333', -
                        Math.PI / 4, -0.4);
                }
                ctx.fillStyle = '#888';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('点击或按数字键选择 | D切换难度 | ESC返回', canvas.width / 2, 500);
            }
            drawLevelSelect() {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                this.menuParticles.draw(ctx, 0, 0);
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 42px Arial';
                ctx.shadowColor = '#ff8800';
                ctx.shadowBlur = 18;
                ctx.fillText('选择关卡', canvas.width / 2, 70);
                ctx.shadowBlur = 0;
                ctx.font = '15px Arial';
                ctx.fillStyle = '#ccc';
                ctx.fillText('已解锁至第 ' + this.maxUnlockedLevel + ' 关', canvas.width / 2, 110);
                ctx.fillStyle = '#888';
                ctx.font = '13px Arial';
                ctx.fillText('← 返回', 60, 42);
                for (let i = 1; i <= 9; i++) {
                    const x = canvas.width / 2 - 220 + (i - 1) * 55;
                    const y = 170;
                    const locked = i > this.maxUnlockedLevel;
                    const hover = this.mouse.x > x - 22 && this.mouse.x < x + 22 && this.mouse.y > y - 20 && this
                        .mouse.y < y + 20;
                    ctx.fillStyle = locked ? 'rgba(60,60,60,0.7)' : hover ? 'rgba(255,255,255,0.25)' :
                        'rgba(255,255,255,0.1)';
                    roundRect(ctx, x - 22, y - 20, 44, 40, 10);
                    ctx.fill();
                    if (locked) {
                        ctx.fillStyle = '#555';
                        ctx.font = '15px Arial';
                        ctx.fillText('🔒', x, y + 6);
                    } else {
                        ctx.fillStyle = '#66bb6a';
                        ctx.font = 'bold 18px Arial';
                        ctx.fillText(i, x, y + 6);
                    }
                    if (hover && !locked) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                        ctx.lineWidth = 1.5;
                        roundRect(ctx, x - 22, y - 20, 44, 40, 10);
                        ctx.stroke();
                    }
                }
                ctx.fillStyle = '#888';
                ctx.font = '12px Arial';
                ctx.fillText('点击或按数字键选择已解锁关卡 | ESC返回', canvas.width / 2, 260);
            }
        }

        // ==================== 启动 ====================
        window.addEventListener('load', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const game = new Game();
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.focus();
            });
            window.addEventListener('keydown', e => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            });
        });
    </script>
